<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 适配移动端 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>

  <!-- defer：脚本下载不阻塞页面解析，DOM 就绪后才执行，脚本里可以安全地查找元素 -->
  <script src="todo.js" defer></script>

  <style>
    /* 让元素的宽高包含内边距和边框 */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      background: linear-gradient(135deg, #9922dd, #2266ee);
      color: #222;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }

    input,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .todo-app {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px;
      background: #fff;
      border-radius: 12px;
    }

    .title {
      margin: 0 0 30px;
      /* 居中对齐 */
      text-align: center;
      font-size: 36px;
    }

    .input-label {
      /* 独占一行 */
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .input-group {
      display: flex;
      margin-bottom: 12px;
    }

    .todo-input {
      flex: 1;
      /* 允许 Flex 子项在窄屏下收缩 */
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #aaa;
      border-radius: 24px 0 0 24px;
      background: #fff;
    }

    .todo-button {
      flex-shrink: 0;
      padding: 14px 24px;
      border: none;
      border-radius: 0 24px 24px 0;
      background: linear-gradient(90deg, #7530ad, #3453c7);
      color: #fff;
    }

    /* 伪类，鼠标悬浮在按钮上时，会稍微变亮一点 */
    .todo-button:hover {
      filter: brightness(1.1);
    }

    /* 键盘操作时显示焦点轮廓 */
    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #3453c7;
      outline-offset: 3px;
    }

    .hint {
      margin: 0 0 24px;
      color: #666;
      font-size: 14px;
    }

    .todo-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      /* 去掉列表默认序号 */
      list-style: none;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 8px #00000018;
    }

    .item-left {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 8px;
      min-width: 0;
      cursor: pointer;
    }

    .todo-checkbox {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #7530ad;
      cursor: pointer;
    }

    .name {
      font-size: 17px;
      /* 长单词或连续字符也可以换行 */
      overflow-wrap: anywhere;
    }

    /* 选中复选框时，只改变后面任务文字的样式 */
    .todo-checkbox:checked + .name {
      color: #777;
      text-decoration: line-through;
    }

    .delete-button {
      flex-shrink: 0;
      padding: 8px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #b42323;
    }

    .delete-button:hover {
      background: #fff0f0;
    }

    /* 窄屏下减少留白，给内容保留更多空间 */
    @media (max-width: 480px) {
      body {
        padding: 24px 12px;
      }

      .todo-app {
        padding: 24px 16px;
      }

      .title {
        font-size: 28px;
      }

      .todo-input {
        padding: 12px;
      }

      .todo-button {
        padding: 12px 16px;
      }

      .item {
        gap: 8px;
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="todo-app">
    <h1 class="title">待办清单</h1>

    <!-- 分组：添加待办 -->
    <section aria-label="添加待办">
        <!-- 点击时会自动选中输入框 -->
      <label class="input-label" for="todo-input">待办内容</label>

      <div class="input-group">
        <input
          class="todo-input"
          id="todo-input"
          type="text"
          placeholder="例如：学习 CSS"
        >
        <button class="todo-button" type="button">添加</button>
      </div>

      <p class="hint" id="demo-hint">
        当前为 JS 练习：支持添加（点击按钮或按回车）、勾选和删除。
      </p>
    </section>

    <ul class="todo-list">
      <li class="item">
        <label class="item-left">
          <input class="todo-checkbox" type="checkbox" checked>
          <span class="name">吃饭</span>
        </label>

        <button
          class="delete-button"
          type="button">
          删除
        </button>
      </li>

      <li class="item">
        <label class="item-left">
          <input class="todo-checkbox" type="checkbox">
          <span class="name">睡觉</span>
        </label>

        <button
          class="delete-button"
          type="button">
          删除
        </button>
      </li>

      <li class="item">
        <label class="item-left">
          <input class="todo-checkbox" type="checkbox">
          <span class="name">学习 JS</span>
        </label>

        <button
          class="delete-button"
          type="button">
          删除
        </button>
      </li>
    </ul>
  </main>
</body>
</html>
